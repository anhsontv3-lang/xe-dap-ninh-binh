name: V2.5 test package

on:
  push:
    branches: [v2.5-test]
    paths:
      - '.github/workflows/v25-test.yml'
      - 'xe-dap-ninh-binh/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2.5 test source
        uses: actions/checkout@v4
        with:
          ref: v2.5-test
          fetch-depth: 1

      - name: Verify plugin source
        run: |
          test -f xe-dap-ninh-binh/xe-dap-ninh-binh.php
          grep -q '^ \* Version: 2.5.0' xe-dap-ninh-binh/xe-dap-ninh-binh.php
          grep -q "const VERSION = '2.5.0';" xe-dap-ninh-binh/xe-dap-ninh-binh.php

      - name: PHP syntax check
        run: php -l xe-dap-ninh-binh/xe-dap-ninh-binh.php

      - name: Build WordPress ZIP
        run: |
          set -e
          rm -rf build xe-dap-ninh-binh-v2.5.0-test.zip
          mkdir -p build/xe-dap-ninh-binh
          cp -R xe-dap-ninh-binh/. build/xe-dap-ninh-binh/
          cd build
          zip -qr ../xe-dap-ninh-binh-v2.5.0-test.zip xe-dap-ninh-binh
          cd ..
          unzip -tq xe-dap-ninh-binh-v2.5.0-test.zip
          unzip -l xe-dap-ninh-binh-v2.5.0-test.zip | grep -q 'xe-dap-ninh-binh/xe-dap-ninh-binh.php'
          unzip -p xe-dap-ninh-binh-v2.5.0-test.zip xe-dap-ninh-binh/xe-dap-ninh-binh.php | grep -q '^ \* Version: 2.5.0'

      - name: Upload V2.5 test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xe-dap-ninh-binh-v2.5.0-test
          path: xe-dap-ninh-binh-v2.5.0-test.zip
          if-no-files-found: error
          retention-days: 7
