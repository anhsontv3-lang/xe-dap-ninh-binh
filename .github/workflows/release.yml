name: Build and publish plugin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, for example 2.5.2'
        required: true
        default: '2.5.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Prepare plugin package
        run: |
          VERSION="${{ inputs.version }}"
          rm -rf build
          mkdir -p "build/xe-dap-ninh-binh"
          cp -R xe-dap-ninh-binh/. "build/xe-dap-ninh-binh/"

          MAIN="build/xe-dap-ninh-binh/xe-dap-ninh-binh.php"

          sed -i -E "s/^ \* Version: .*/ * Version: ${VERSION}/" "$MAIN"
          sed -i -E "s/const VERSION = '[^']+';/const VERSION = '${VERSION}';/" "$MAIN"
          sed -i -E "s/V[0-9]+\.[0-9]+\.[0-9]+/V${VERSION}/g" "$MAIN"

          # Package must contain the plugin directory at ZIP root.
          cd build
          zip -r "../xe-dap-ninh-binh-v${VERSION}.zip" xe-dap-ninh-binh >/dev/null
          cd ..

          test -f "xe-dap-ninh-binh-v${VERSION}.zip"

          # Fail the release if the package does not contain the main plugin file.
          unzip -l "xe-dap-ninh-binh-v${VERSION}.zip" | grep -q "xe-dap-ninh-binh/xe-dap-ninh-binh.php"

          # Verify the version that will actually be installed.
          unzip -p "xe-dap-ninh-binh-v${VERSION}.zip" "xe-dap-ninh-binh/xe-dap-ninh-binh.php" | grep -E "^ \* Version: ${VERSION}|const VERSION = '${VERSION}'"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          git tag -f "v${VERSION}" "$GITHUB_SHA"
          git push -f origin "v${VERSION}"
          gh release create "v${VERSION}" "xe-dap-ninh-binh-v${VERSION}.zip" \
            --title "XE DAP NINH BINH v${VERSION}" \
            --notes "## XE DAP NINH BINH v${VERSION}\n\n- Hiển thị bộ đếm nhập sản phẩm màu xanh ở đầu trang.\n- Đếm riêng sản phẩm tạo thành công, sản phẩm bỏ qua và lỗi trong quá trình nhập.\n- Tích hợp luồng AI SEO trong importer.\n- AI chỉ viết lại nội dung; dữ liệu giá, SKU, thuộc tính, variation và ảnh lấy từ nguồn.\n- Sản phẩm nhập mới mặc định ở trạng thái Draft.\n- Lưu URL nguồn để chống nhập trùng.\n- Đóng gói ZIP đúng cấu trúc cho WordPress.\n- Tiếp tục hỗ trợ cập nhật từ GitHub." \
            --latest
