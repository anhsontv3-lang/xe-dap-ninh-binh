name: Build and publish plugin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, for example 2.4.0'
        required: true
        default: '2.4.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Prepare plugin package
        run: |
          VERSION="${{ inputs.version }}"
          rm -rf build
          mkdir -p "build/xe-dap-ninh-binh"
          cp -R xe-dap-ninh-binh/. "build/xe-dap-ninh-binh/"

          MAIN="build/xe-dap-ninh-binh/xe-dap-ninh-binh.php"

          # Package version is controlled by the release input.
          sed -i -E "s/^ \* Version: .*/ * Version: ${VERSION}/" "$MAIN"
          sed -i -E "s/const VERSION = '[^']+';/const VERSION = '${VERSION}';/" "$MAIN"

          # Tell WordPress that this custom GitHub update offer may be
          # automatically installed. The plugin still uses its own
          # Update URI + GitHub release package as the update source.
          sed -i "s/'requires_php'=>'7.4'/'requires_php'=>'7.4','autoupdate'=>true/" "$MAIN"

          # Keep the admin version label synchronized with the release.
          sed -i -E "s/V2\.2\.1/V${VERSION}/g" "$MAIN"

          # IMPORTANT: zip from inside build so the ZIP root is exactly
          # xe-dap-ninh-binh/, which is the folder WordPress expects.
          cd build
          zip -r "../xe-dap-ninh-binh-v${VERSION}.zip" xe-dap-ninh-binh >/dev/null
          cd ..

          test -f "xe-dap-ninh-binh-v${VERSION}.zip"
          unzip -l "xe-dap-ninh-binh-v${VERSION}.zip" | head -30
          grep -E '^ \* Version:|const VERSION|autoupdate' "$MAIN"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          git tag -f "v${VERSION}" "$GITHUB_SHA"
          git push -f origin "v${VERSION}"
          gh release create "v${VERSION}" "xe-dap-ninh-binh-v${VERSION}.zip" \
            --title "XE DAP NINH BINH v${VERSION}" \
            --notes "## XE DAP NINH BINH v${VERSION}\n\n- Cải thiện cơ chế cập nhật từ GitHub.\n- Cho phép WordPress tự động cập nhật plugin từ release package.\n- Giữ cấu trúc ZIP tương thích với WordPress.\n- Giữ nguyên dữ liệu cấu hình và chức năng importer hiện tại." \
            --latest
