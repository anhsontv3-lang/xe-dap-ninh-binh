name: Build and publish plugin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, for example 2.6.1'
        required: true
        default: '2.6.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Prepare clean single-plugin package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf build
          mkdir -p "build/xe-dap-ninh-binh"

          # Ship only the real main plugin file. The old PHP modules were
          # separate WordPress plugins because they contained plugin headers.
          cp xe-dap-ninh-binh/xe-dap-ninh-binh.php "build/xe-dap-ninh-binh/xe-dap-ninh-binh.php"

          MAIN="build/xe-dap-ninh-binh/xe-dap-ninh-binh.php"

          python3 - "$MAIN" "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          main = Path(sys.argv[1])
          version = sys.argv[2]
          src = main.read_text(encoding="utf-8")

          src = re.sub(r'^ \* Version: .*$', f' * Version: {version}', src, count=1, flags=re.M)
          src = re.sub(r"const VERSION = '[^']+';", f"const VERSION = '{version}';", src, count=1)
          src = re.sub(r'V[0-9]+\.[0-9]+\.[0-9]+', f'V{version}', src)

          # Upgrade migration. WordPress does not run activation hooks for a
          # silent plugin update, so the migration is checked from admin_init.
          legacy_block = r'''    public function run_migrations() {
        $done = get_option('xdn_migration_261', '');
        if ($done === '1') return;

        $legacy = [
            'xe-dap-ninh-binh/xe-dap-ninh-binh-v2.3-variation-guard.php',
            'xe-dap-ninh-binh/xe-dap-ninh-binh-ai-v2.5.php',
            'xe-dap-ninh-binh/v2.5.1-ai-bridge.php',
            'xe-dap-ninh-binh/xe-dap-ninh-binh-variation-guard.php',
            'xe-dap-ninh-binh/xe-dap-ninh-binh-ai-product-importer.php',
        ];

        if (is_admin()) {
            if (!function_exists('deactivate_plugins')) {
                require_once ABSPATH . 'wp-admin/includes/plugin.php';
            }
            deactivate_plugins($legacy, true, null);
        }

        foreach ($legacy as $plugin_file) {
            $path = WP_PLUGIN_DIR . '/' . $plugin_file;
            if (is_file($path)) {
                @unlink($path);
            }
        }

        update_option('xdn_migration_261', '1', false);
    }

'''
          needle = '    private function plugin_basename(){return plugin_basename(__FILE__);}'
          if 'function run_migrations()' not in src:
              src = src.replace(needle, legacy_block + needle, 1)

          needle = "        add_action('admin_post_xdn_check_update', [$this, 'manual_update_check']);"
          replacement = needle + "\n        add_action('admin_init', [$this, 'run_migrations'], 1);"
          if "add_action('admin_init', [$this, 'run_migrations'], 1);" not in src:
              src = src.replace(needle, replacement, 1)

          main.write_text(src, encoding='utf-8')
          PY

          test -f "$MAIN"
          test "$(find build/xe-dap-ninh-binh -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 1
          grep -q "Plugin Name: XE DAP NINH BINH" "$MAIN"
          grep -q "Version: ${VERSION}" "$MAIN"
          grep -q "const VERSION = '${VERSION}';" "$MAIN"
          grep -q "Update URI: https://github.com/anhsontv3-lang/xe-dap-ninh-binh" "$MAIN"
          grep -q "function run_migrations()" "$MAIN"
          grep -q "xdn_migration_261" "$MAIN"

          cd build
          zip -r "../xe-dap-ninh-binh-v${VERSION}.zip" xe-dap-ninh-binh >/dev/null
          cd ..

          test -f "xe-dap-ninh-binh-v${VERSION}.zip"
          unzip -l "xe-dap-ninh-binh-v${VERSION}.zip" | grep -q "xe-dap-ninh-binh/xe-dap-ninh-binh.php"
          if unzip -l "xe-dap-ninh-binh-v${VERSION}.zip" | grep -Eq 'xe-dap-ninh-binh/(v2\.5\.1-ai-bridge|xe-dap-ninh-binh-ai-v2\.5|xe-dap-ninh-binh-v2\.3-variation-guard|xe-dap-ninh-binh-variation-guard|xe-dap-ninh-binh-ai-product-importer)\.php'; then
            echo 'Legacy plugin PHP file found in release package.'
            exit 1
          fi

      - name: Persist prepared main plugin source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp "build/xe-dap-ninh-binh/xe-dap-ninh-binh.php" "xe-dap-ninh-binh/xe-dap-ninh-binh.php"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xe-dap-ninh-binh/xe-dap-ninh-binh.php
          if ! git diff --cached --quiet; then
            git commit -m "Release V${VERSION} source update [skip ci]"
            git push origin main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          git tag -f "v${VERSION}" HEAD
          git push -f origin "v${VERSION}"
          gh release create "v${VERSION}" "xe-dap-ninh-binh-v${VERSION}.zip" \
            --title "XE DAP NINH BINH v${VERSION}" \
            --notes "## XE DAP NINH BINH v${VERSION}\n\n- Sửa cơ chế đóng gói: chỉ còn một plugin chính XE DAP NINH BINH.\n- Update đè đúng thư mục plugin theo chuẩn WordPress.\n- Loại bỏ các module PHP cũ khỏi package.\n- Tự dọn các module cũ còn sót lại và active-plugin entries sau khi cập nhật.\n- Giữ nguyên cấu hình OpenAI, dữ liệu sản phẩm, SEO internal links và thông số kỹ thuật.\n- ZIP có cấu trúc xe-dap-ninh-binh/xe-dap-ninh-binh.php." \
            --latest
