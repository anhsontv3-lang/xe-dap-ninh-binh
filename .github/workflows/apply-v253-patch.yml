name: Apply V2.6 SEO patch

on:
  push:
    paths:
      - 'tools/v260_patch.py'
      - 'tools/v260_trigger.txt'
      - 'tools/v253_patch.py'
      - 'tools/v253_fix.py'
      - 'tools/v253_trigger.txt'
      - 'xe-dap-ninh-binh/xe-dap-ninh-binh.php'
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V2.6 patch
        run: python3 tools/v260_patch.py

      - name: Commit V2.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xe-dap-ninh-binh/xe-dap-ninh-binh.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Release V2.6.0 SEO internal links and specs [skip ci]"
          git push
